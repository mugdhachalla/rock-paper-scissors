<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="header">
        <h1>LET'S PLAY!</h1>
    </div>
    <br>
    <br>
    <div id="buttons"> 
        <button id="rock">  🌑ROCK </button>
        <button id= "paper"> 📄PAPER </button>
        <button id= "scissors"> ✂️SCISSORS</button>
    </div>
    <br>
    <br>
    <div id="result-score">
      <div id="result">
        <h3>RESULT:</h3>
        <p id="user_choice">You Chose: </p>
        <p id="comp_choice">The Computer Chose: </p>
        <p id="winner">Result: </p>
      </div> 
      <br>
      <div id="score">
        <h3>SCORE:</h3>
        <p id="uwin">YOU: </p>
        <p id="compwin">THE COMPUTER: </p>
        <p id="ties">TIES: </p>
      </div>
    </div>
    <button id="reset"> RESET SCORE </button>
   
<script src="script.js"></script>
</body>
</html>
